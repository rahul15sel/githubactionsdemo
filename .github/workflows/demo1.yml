name: GitHub Actions Demo - Rahul

on:
  push:

jobs:

  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: echo "Hello World GitHub Action push Step 1!"

  second-job1:
    needs: first-job   # <-- ensures this job runs after first-job finishes
    runs-on: ubuntu-latest
    steps:
      - name: Step 2 - Echo message
        run: echo "Hello World GitHub Action 2 Step 2!"

      - name: Step 3 - Run math and show time
        run: |
          echo $((1+1))
          echo "Current time: $(date)"
